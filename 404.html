<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>404</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body {
    display: flex;
    flex-direction: column;
    font-family: 'Courier New', monospace;
    touch-action: none;
  }
  canvas { display: block; margin: 10px; }
  #label {
    position: fixed;
    bottom: 12px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 1rem;
    font-weight: bold;
    letter-spacing: 0.5em;
    color: #555;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="maze"></canvas>
<div id="label">404</div>

<script>
const canvas = document.getElementById('maze');
const ctx = canvas.getContext('2d');

const W = 2; // wall thickness
const P = 2; // path thickness
const CELL = W + P; // each cell = wall + path = 4px

let COLS, ROWS, maze, player, won, mazeImg;

function initSize() {
  canvas.width = window.innerWidth - 20;
  canvas.height = window.innerHeight - 20;
  COLS = Math.floor((canvas.width - W) / CELL);
  ROWS = Math.floor((canvas.height - W) / CELL);
}

function generate() {
  maze = Array.from({length: ROWS}, () =>
    Array.from({length: COLS}, () => ({top:true, right:true, bottom:true, left:true, visited:false}))
  );
  const stack = [];
  let r = 0, c = 0;
  maze[r][c].visited = true;
  stack.push([r, c]);
  while (stack.length) {
    const nb = [];
    if (r > 0 && !maze[r-1][c].visited) nb.push([r-1, c, 'top', 'bottom']);
    if (r < ROWS-1 && !maze[r+1][c].visited) nb.push([r+1, c, 'bottom', 'top']);
    if (c > 0 && !maze[r][c-1].visited) nb.push([r, c-1, 'left', 'right']);
    if (c < COLS-1 && !maze[r][c+1].visited) nb.push([r, c+1, 'right', 'left']);
    if (nb.length) {
      const [nr, nc, w, o] = nb[Math.random() * nb.length | 0];
      maze[r][c][w] = false;
      maze[nr][nc][o] = false;
      maze[nr][nc].visited = true;
      stack.push([r, c]);
      r = nr; c = nc;
    } else {
      [r, c] = stack.pop();
    }
  }
}

function bakeMaze() {
  const buf = document.createElement('canvas');
  buf.width = canvas.width;
  buf.height = canvas.height;
  const b = buf.getContext('2d');

  b.fillStyle = '#000';
  b.fillRect(0, 0, buf.width, buf.height);

  b.fillStyle = '#fff';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = W + c * CELL;
      const y = W + r * CELL;
      const cell = maze[r][c];
      b.fillRect(x, y, P, P);
      if (!cell.right && c < COLS - 1) b.fillRect(x + P, y, W, P);
      if (!cell.bottom && r < ROWS - 1) b.fillRect(x, y + P, P, W);
    }
  }
  b.fillRect(W, 0, P, W);
  b.fillRect(W + (COLS - 1) * CELL, W + (ROWS - 1) * CELL + P, P, W);

  mazeImg = buf;
}

function draw() {
  ctx.drawImage(mazeImg, 0, 0);
  if (!won) {
    ctx.fillStyle = '#f00';
    ctx.fillRect(W + player.c * CELL, W + player.r * CELL, P, P);
  }
}

function openings(r, c) {
  const cell = maze[r][c];
  let n = 0;
  if (!cell.top) n++;
  if (!cell.bottom) n++;
  if (!cell.left) n++;
  if (!cell.right) n++;
  return n;
}

function canMove(r, c, dr, dc) {
  const cell = maze[r][c];
  if (dr === -1 && !cell.top) return true;
  if (dr === 1  && !cell.bottom) return true;
  if (dc === -1 && !cell.left) return true;
  if (dc === 1  && !cell.right) return true;
  return false;
}

function move(dr, dc) {
  if (won) return;
  if (!canMove(player.r, player.c, dr, dc)) return;
  do {
    player.r += dr;
    player.c += dc;
    if (player.r === ROWS - 1 && player.c === COLS - 1) break;
    if (openings(player.r, player.c) !== 2) break;
    if (!canMove(player.r, player.c, dr, dc)) break;
  } while (true);
  draw();
  if (player.r === ROWS - 1 && player.c === COLS - 1) {
    won = true;
    draw();
    document.getElementById('label').textContent = 'escaped';
    setTimeout(() => { window.location.href = '/'; }, 1200);
  }
}

function newMaze() {
  initSize();
  generate();
  player = {r: Math.random() * ROWS | 0, c: Math.random() * COLS | 0};
  won = false;
  document.getElementById('label').textContent = '404';
  bakeMaze();
  draw();
}

document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp':    move(-1, 0); e.preventDefault(); break;
    case 'ArrowDown':  move(1, 0);  e.preventDefault(); break;
    case 'ArrowLeft':  move(0, -1); e.preventDefault(); break;
    case 'ArrowRight': move(0, 1);  e.preventDefault(); break;
  }
});

let tx, ty;
canvas.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  const dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
  if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
  else move(dy > 0 ? 1 : -1, 0);
});

let ping = null;
function doPing() {
  const px = W + player.c * CELL + P / 2;
  const py = W + player.r * CELL + P / 2;
  ping = {x: px, y: py, r: 0, alpha: 1};
  function animatePing() {
    if (ping.alpha <= 0) { ping = null; draw(); return; }
    draw();
    ping.r += 1.5;
    ping.alpha -= 0.02;
    ctx.strokeStyle = 'rgba(255,0,0,' + Math.max(0, ping.alpha) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(ping.x, ping.y, ping.r, 0, Math.PI * 2);
    ctx.stroke();
    requestAnimationFrame(animatePing);
  }
  animatePing();
}

canvas.addEventListener('click', () => { if (won) newMaze(); else doPing(); });

newMaze();
window.addEventListener('resize', () => newMaze());
</script>
</body>
</html>
