<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.js"></script>
<script>
  function setup() {
    var canvas = createCanvas(20, 20);
    canvas.parent("homePageArtCanvas");
    noStroke();

    // Random Spaceship Assembly
    // By Atul Vinayak
    // Pattern comes from spaceship.html so the favicon matches
    var ship = window.spaceship;
    var w = width / ship.npix;
    for (var y = 0; y < ship.npix; y++) {
      for (var x = 0; x < ship.half[y].length; x++) {
        if (ship.half[y][x]) {
          fill(0);
          rect(x * w, y * w, w, w);
          rect((ship.npix - x - 1) * w, y * w, w, w);
        }
      }
    }
  }
</script>
<span id="homePageArtCanvas"></span>
