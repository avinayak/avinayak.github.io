<script>
  // Shared random spaceship. Seeded by unix time / 10, so it changes
  // every 10 seconds. The header art and the favicon read the same
  // pattern, so they always match.
  (function () {
    var npix = 5;
    var seed = Math.floor(Date.now() / 1000 / 10);

    // mulberry32: tiny seeded random number generator
    function rng(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        var t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    // half[y][x] is true when that cell is filled (left half only,
    // the right half is mirrored)
    var next = rng(seed);
    var half = [];
    for (var y = 0; y < npix; y++) {
      half[y] = [];
      for (var x = 0; x < Math.floor(npix / 2); x++) {
        half[y][x] = next() < 0.5;
      }
    }

    window.spaceship = { npix: npix, seed: seed, half: half };
  })();
</script>
